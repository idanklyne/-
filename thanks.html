<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>תודה על ההזמנה | אדמא</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#fbf8f3">
  <link rel="icon" type="image/png" href="assets/images/adma-emblem-teal.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&amp;family=Noto+Serif+Hebrew:wght@600;700&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --earth: #523b32; --forest: #0e4b57; --forest-deep: #0a3943;
      --paper: #fbf8f3; --wash: #f2ece5; --mint: #e8eee7; --ink: #2b231f; --muted: #6b6159;
      --line: #ded2c6; --white: #fffdf8; --radius: 18px; --radius-sm: 12px;
      --serif: "Noto Serif Hebrew", Georgia, serif;
    }
    html { background: var(--paper); }
    body { margin: 0; font-family: "Heebo", Arial, sans-serif; color: var(--ink); line-height: 1.6; }
    .wrap { max-width: 560px; margin: 0 auto; padding: 40px 20px 64px; display: grid; gap: 28px; }
    .brand { display: flex; justify-content: center; }
    .brand img { width: 64px; height: 64px; }
    .card { background: var(--white); border: 1px solid var(--line); border-radius: var(--radius); padding: 28px 24px; display: grid; gap: 16px; text-align: center; }
    .check { width: 64px; height: 64px; margin: 0 auto; border-radius: 50%; background: var(--mint); color: var(--forest); display: grid; place-items: center; }
    .check svg { width: 32px; height: 32px; }
    h1 { margin: 0; font-family: var(--serif); font-size: 2rem; color: var(--earth); line-height: 1.2; }
    p { margin: 0; }
    .lead { color: var(--muted); }
    .pickup { background: var(--wash); border-radius: var(--radius-sm); padding: 18px; display: grid; gap: 6px; text-align: right; }
    .pickup strong { color: var(--earth); }
    .pickup .addr { font-size: 1.15rem; font-weight: 700; color: var(--forest); }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 9px;
      min-height: 50px; padding: 0 24px; border-radius: 999px; border: 1px solid transparent;
      font-weight: 700; font-size: 1rem; text-decoration: none; cursor: pointer;
    }
    .btn-forest { background: var(--forest); color: var(--white); }
    .btn-forest:hover { background: var(--forest-deep); }
    .btn-ghost { background: var(--white); color: var(--earth); border-color: rgba(82, 59, 50, 0.22); }
    .btn-ghost:hover { border-color: var(--earth); }
    .btn svg { width: 20px; height: 20px; }
    .actions { display: grid; gap: 10px; }
    .fine { font-size: 0.86rem; color: var(--muted); }
    .phone { direction: ltr; unicode-bidi: isolate; }
    a:focus-visible { outline: 2px solid var(--forest); outline-offset: 2px; }
  </style>
</head>
<body>
  <main class="wrap">
    <a class="brand" href="/" aria-label="אדמא - חזרה לאתר">
      <img src="assets/images/adma-emblem-teal.png" alt="">
    </a>

    <section class="card" aria-labelledby="title">
      <div class="check" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h1 id="title">תודה, ההזמנה התקבלה</h1>
      <p class="lead">התשלום עבר בהצלחה ואור קיבלה את ההזמנה. אישור על התשלום יגיע אליכם מ-Grow.</p>

      <div class="pickup">
        <strong>איסוף עצמי, בתיאום מראש בלבד</strong>
        <p class="addr">חטיבת הראל 2, מודיעין</p>
        <p>כותבים או מתקשרים לאור, <span class="phone">054-8858424</span>, וקובעים מתי לאסוף.</p>
      </div>

      <div class="actions">
        <a class="btn btn-forest" id="waBtn" href="https://wa.me/972548858424" target="_blank" rel="noopener" aria-label="תיאום איסוף ב-WhatsApp (נפתח בחלון חדש)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1.4-4.2A8 8 0 1 1 8.3 18.6L4 20z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
          לתיאום איסוף ב-WhatsApp
        </a>
        <a class="btn btn-ghost" href="/">חזרה לאתר</a>
      </div>
      <p class="fine">מדיניות ביטולים והחזרות: <a href="legal/returns.html">כאן</a>.</p>
    </section>
  </main>

  <script>
    (function () {
      /* Clear the cart that was just paid for, and prefill the pickup message. */
      try { localStorage.removeItem("adma-cart"); } catch (e) {}
      var text = "היי אור, שילמתי עכשיו באתר של אדמא ואשמח לתאם איסוף.";
      document.getElementById("waBtn").href = "https://wa.me/972548858424?text=" + encodeURIComponent(text);
    })();
  </script>
</body>
</html>
